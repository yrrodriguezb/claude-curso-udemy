<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NexusHR — Iniciar sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="login-page">
      <!-- Brand panel -->
      <div class="login-brand">
        <div class="brand-logo">
          <svg
            viewBox="0 0 44 44"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              width="44"
              height="44"
              rx="12"
              fill="rgba(255,255,255,0.15)"
            />
            <path
              d="M12 30V14h6l4 10 4-10h6v16h-4V20l-4 10h-4l-4-10v10h-4z"
              fill="white"
            />
          </svg>
          <span>NexusHR</span>
        </div>
        <h1 class="brand-tagline">Gestión de talento<br />sin fricciones</h1>
        <p class="brand-sub">
          La plataforma todo-en-uno para equipos de RRHH modernos. Nóminas,
          ausencias, onboarding y más.
        </p>
        <div class="brand-badges">
          <span class="brand-badge">✦ ISO 27001</span>
          <span class="brand-badge">✦ RGPD Compliant</span>
          <span class="brand-badge">✦ SOC 2 Type II</span>
        </div>
      </div>

      <!-- Form panel -->
      <div class="login-form-panel">
        <div class="login-form-wrap">
          <h2 id="formTitle">Bienvenido de nuevo</h2>
          <p class="subtitle">
            Introduce tus credenciales para acceder al panel
          </p>

          <div id="loginError" class="alert alert-error hidden" role="alert"></div>
          <div id="loginInfo" class="alert alert-success hidden" role="status"></div>

          <form id="loginForm">
            <div class="form-group hidden" id="nameGroup">
              <label for="fullName">Nombre completo</label>
              <input
                type="text"
                id="fullName"
                name="fullName"
                maxlength="120"
                autocomplete="name"
              />
            </div>
            <div class="form-group">
              <label for="email">Correo electrónico</label>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="tu@empresa.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary" id="loginBtn">
              Iniciar sesión
            </button>
          </form>

          <button type="button" class="btn btn-secondary btn-block-spaced" id="toggleMode">
            ¿No tienes cuenta? Regístrate
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="dist/auth.js"></script>
  </body>
</html>
